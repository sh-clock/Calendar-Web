name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: $${ steps.deployment.outputs.page_url }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Pages is not pre-enabled on this repo (the fine-grained PAT lacks
          # the Pages REST permission); let the workflow token create the site.
          enablement: true
      - name: Assemble site (static client only)
        run: |
          mkdir -p _site/js/vendor _site/css
          cp index.html _site/
          cp js/*.js _site/js/
          cp js/vendor/rrule.mjs _site/js/vendor/rrule.mjs
          cp js/vendor/rrule.LICENCE _site/js/vendor/rrule.LICENCE
          cp css/*.css _site/css/
          cp README.md _site/ 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
